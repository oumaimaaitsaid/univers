<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" fill="none">
  <defs>
    <!-- Rich Gold Gradient for Laurel & Wordmark -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C773" />
      <stop offset="40%" stop-color="#C9972E" />
      <stop offset="75%" stop-color="#F3DC9B" />
      <stop offset="100%" stop-color="#AA7818" />
    </linearGradient>

    <!-- Deep Navy Color for Star and Accents -->
    <linearGradient id="navyStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2B52" />
      <stop offset="100%" stop-color="#0F1B3D" />
    </linearGradient>
  </defs>

  <!-- LAUREL WREATH (Circular Golden Crown) -->
  <g transform="translate(250, 160)" stroke="url(#goldGrad)">
    <!-- Laurel Branch Left -->
    <path d="M-20 115 C-80 100 -125 55 -125 -15 C-125 -65 -90 -115 -35 -145" fill="none" stroke-width="4.5" stroke-linecap="round" />
    <!-- Left Leaves -->
    <g fill="url(#goldGrad)" stroke="none">
      <path d="M-30 112 C-45 125 -60 120 -55 105 C-50 95 -35 100 -30 112 Z" />
      <path d="M-60 95 C-85 105 -95 95 -85 80 C-75 75 -65 85 -60 95 Z" />
      <path d="M-90 70 C-115 75 -120 60 -105 50 C-95 50 -90 60 -90 70 Z" />
      <path d="M-110 35 C-135 35 -135 20 -118 15 C-108 18 -108 28 -110 35 Z" />
      <path d="M-122 -5 C-142 -10 -140 -25 -122 -28 C-112 -22 -115 -12 -122 -5 Z" />
      <path d="M-118 -45 C-135 -55 -130 -70 -112 -70 C-105 -60 -110 -50 -118 -45 Z" />
      <path d="M-100 -85 C-115 -100 -105 -115 -90 -110 C-85 -100 -90 -90 -100 -85 Z" />
      <path d="M-70 -120 C-82 -135 -70 -150 -55 -142 C-55 -130 -60 -122 -70 -120 Z" />
      <path d="M-40 -145 C-48 -162 -32 -170 -20 -160 C-22 -150 -30 -145 -40 -145 Z" />
    </g>

    <!-- Laurel Branch Right -->
    <path d="M20 115 C80 100 125 55 125 -15 C125 -65 90 -115 35 -145" fill="none" stroke-width="4.5" stroke-linecap="round" />
    <!-- Right Leaves -->
    <g fill="url(#goldGrad)" stroke="none">
      <path d="M30 112 C45 125 60 120 55 105 C50 95 35 100 30 112 Z" />
      <path d="M60 95 C85 105 95 95 85 80 C75 75 65 85 60 95 Z" />
      <path d="M90 70 C115 75 120 60 105 50 C95 50 90 60 90 70 Z" />
      <path d="M110 35 C135 35 135 20 118 15 C108 18 108 28 110 35 Z" />
      <path d="M122 -5 C142 -10 140 -25 122 -28 C112 -22 115 -12 122 -5 Z" />
      <path d="M118 -45 C135 -55 130 -70 112 -70 C105 -60 110 -50 118 -45 Z" />
      <path d="M100 -85 C115 -100 105 -115 90 -110 C85 -100 90 -90 100 -85 Z" />
      <path d="M70 -120 C82 -135 70 -150 55 -142 C55 -130 60 -122 70 -120 Z" />
      <path d="M40 -145 C48 -162 32 -170 20 -160 C22 -150 30 -145 40 -145 Z" />
    </g>

    <!-- Bottom tie knot and ribbon -->
    <circle cx="0" cy="116" r="6" fill="url(#goldGrad)" />
    <path d="M-15 119 C-5 124 5 124 15 119" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- 5-POINT NAVY STAR WITH DOUBLE GOLD BORDER -->
  <g transform="translate(250, 150)">
    <!-- Outer Gold Rim -->
    <polygon points="0,-102 24,-30 100,-30 38,15 62,88 0,44 -62,88 -38,15 -100,-30 -24,-30" fill="url(#goldGrad)" />
    <!-- Navy Star Fill -->
    <polygon points="0,-92 21,-27 90,-27 34,14 55,79 0,39 -55,79 -34,14 -90,-27 -21,-27" fill="url(#navyStarGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Stylized Gold "X" / Hourglass Emblem inside the Star -->
    <g transform="translate(0, -6)">
      <!-- Left loop/bracket -->
      <path d="M-16 -24 L-8 -24 C-4 -12 -4 -6 -12 0 C-4 6 -4 12 -8 24 L-16 24 C-12 12 -12 6 -18 0 C-12 -6 -12 -12 -16 -24 Z" fill="url(#goldGrad)" />
      <!-- Right loop/bracket -->
      <path d="M16 -24 L8 -24 C4 -12 4 -6 12 0 C4 6 4 12 8 24 L16 24 C12 12 12 6 18 0 C12 -6 12 -12 16 -24 Z" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- WORDMARK: UNIVERS ANIM -->
  <text x="250" y="360" text-anchor="middle" font-family="'Fraunces', 'Cinzel', 'Playfair Display', serif" font-size="44" font-weight="900" letter-spacing="4" fill="url(#goldGrad)">
    UNIVERS ANIM
  </text>

  <!-- SUBTITLE: ASSOCIATION (framed by two gold horizontal lines) -->
  <g transform="translate(0, 385)">
    <line x1="60" y1="-5" x2="135" y2="-5" stroke="url(#goldGrad)" stroke-width="1.8" />
    <text x="250" y="0" text-anchor="middle" font-family="'Inter', sans-serif" font-size="19" font-weight="800" letter-spacing="9" fill="#1C2B52">
      ASSOCIATION
    </text>
    <line x1="365" y1="-5" x2="440" y2="-5" stroke="url(#goldGrad)" stroke-width="1.8" />
  </g>

  <!-- TAGLINE: Ensemble pour un avenir meilleur (cursive script) -->
  <text x="250" y="425" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="21" font-style="italic" font-weight="600" fill="#AA7818">
    Ensemble pour un avenir meilleur
  </text>

  <!-- DIVIDER WITH SMALL GOLD STAR -->
  <g transform="translate(250, 448)">
    <line x1="-70" y1="0" x2="-20" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" />
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="url(#goldGrad)" />
    <line x1="20" y1="0" x2="70" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>

  <!-- THREE CIRCULAR ICONS & LABELS: ANIMATION | CULTURE | SOLIDARITÉ -->
  <g transform="translate(0, 490)">
    <!-- 1. ANIMATION (Icon with 3 people figures) -->
    <g transform="translate(140, 0)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
      <circle cx="0" cy="-5" r="3" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
      <path d="M-6 6 C-6 1 -3 -1 0 -1 C3 -1 6 1 6 6" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
      <circle cx="-8" cy="-3" r="2.2" fill="none" stroke="url(#goldGrad)" stroke-width="1.3" />
      <path d="M-12 6 C-12 3 -10 1 -7 1" fill="none" stroke="url(#goldGrad)" stroke-width="1.3" />
      <circle cx="8" cy="-3" r="2.2" fill="none" stroke="url(#goldGrad)" stroke-width="1.3" />
      <path d="M12 6 C12 3 10 1 7 1" fill="none" stroke="url(#goldGrad)" stroke-width="1.3" />
      <text x="0" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#1C2B52">ANIMATION</text>
    </g>

    <!-- Divider Bar 1 -->
    <line x1="200" y1="-8" x2="200" y2="18" stroke="url(#goldGrad)" stroke-width="1.2" />

    <!-- 2. CULTURE (Icon with Open Book) -->
    <g transform="translate(250, 0)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
      <path d="M-7 -6 C-3 -7 0 -5 0 -2 L0 6 C0 4 -3 2 -7 3 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
      <path d="M7 -6 C3 -7 0 -5 0 -2 L0 6 C0 4 3 2 7 3 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
      <text x="0" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#1C2B52">CULTURE</text>
    </g>

    <!-- Divider Bar 2 -->
    <line x1="300" y1="-8" x2="300" y2="18" stroke="url(#goldGrad)" stroke-width="1.2" />

    <!-- 3. SOLIDARITÉ (Icon with Handshake) -->
    <g transform="translate(360, 0)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
      <path d="M-9 -2 L-4 3 L0 -1 L4 3 L9 -2" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
      <path d="M-7 4 L-3 7 L3 7 L7 4" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
      <text x="0" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#1C2B52">SOLIDARITÉ</text>
    </g>
  </g>
</svg>
