      <path d="M-96 -34 C-110 -42 -106 -54 -92 -54 C-86 -46 -90 -38 -96 -34 Z" />
      <path d="M-82 -68 C-94 -80 -86 -92 -74 -88 C-70 -80 -74 -72 -82 -68 Z" />
      <path d="M-58 -96 C-68 -108 -58 -120 -46 -114 C-46 -104 -50 -98 -58 -96 Z" />
      <path d="M-32 -118 C-38 -132 -26 -138 -16 -130 C-18 -122 -24 -118 -32 -118 Z" />
