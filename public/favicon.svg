      <path d="M50 78 C70 86 78 78 70 66 C62 62 54 70 50 78 Z" />
      <path d="M75 58 C95 62 98 50 86 42 C78 42 74 50 75 58 Z" />
      <path d="M90 30 C110 30 110 18 96 14 C88 16 88 24 90 30 Z" />
      <path d="M100 -2 C116 -6 115 -18 100 -20 C92 -16 94 -8 100 -2 Z" />
      <path d="M96 -34 C110 -42 106 -54 92 -54 C86 -46 90 -38 96 -34 Z" />
      <path d="M82 -68 C94 -80 86 -92 74 -88 C70 -80 74 -72 82 -68 Z" />
