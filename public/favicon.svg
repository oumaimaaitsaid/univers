    <polygon points="0,-82 20,-24 82,-24 32,12 50,72 0,36 -50,72 -32,12 -82,-24 -20,-24" fill="url(#emblemGold)" />
    <polygon points="0,-74 18,-22 74,-22 28,11 45,65 0,32 -45,65 -28,11 -74,-22 -18,-22" fill="url(#emblemNavy)" stroke="url(#emblemGold)" stroke-width="2" />

